name: Apply PDS stability changes

on:
  push:
    branches:
      - ui-overhaul-2026-08

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
          fetch-depth: 1

      - name: Diagnose checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'lib/services/background_service.dart',
              'lib/main.dart',
              'lib/UI/settings_page.dart',
          ]:
              s = Path(name).read_text(encoding='utf-8')
              print(f'FILE {name} bytes={len(s.encode())}')
              for needle in [
                  'pendingOverlayTimers',
                  'final overlayState',
                  'userNotDetected',
                  "overlayState['userNotDetected'] == true",
                  "_showUserNotDetected = false;",
                  "prefs.getBool('monitoring_enabled') ?? true",
              ]:
                  print(f'  {needle!r}: index={s.find(needle)} count={s.count(needle)}')
          PY
          git status --short
          git log -1 --format='%H %s'

      - name: Apply strict final fixes
        shell: bash
        run: python3 tooling/apply_pds_stability.py

      - name: Verify PDS changes
        shell: bash
        run: |
          set -e
          grep -q "overlayState\['userNotDetected'\] == true" lib/services/background_service.dart
          grep -q "postureDetectionWatchdog = null;" lib/services/background_service.dart
          grep -q "_showUserNotDetected = false;" lib/main.dart
          grep -q "prefs.getBool('monitoring_enabled') ?? true" lib/UI/settings_page.dart

      - name: Commit PDS changes
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/background_service.dart lib/UI/dashboard.dart lib/UI/settings_page.dart lib/main.dart tooling/apply_pds_stability.py
          if git diff --cached --quiet; then
            echo 'No PDS changes to commit.'
            exit 0
          fi
          git commit -m 'Apply final PDS fixes'
          git push origin ui-overhaul-2026-08
