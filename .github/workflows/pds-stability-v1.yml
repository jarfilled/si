name: Apply PDS stability changes

on:
  push:
    branches:
      - ui-overhaul-2026-08

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
          fetch-depth: 1

      - name: Apply PDS changes
        shell: bash
        run: python3 tooling/apply_pds_stability.py

      - name: Verify PDS changes
        shell: bash
        run: |
          set -e
          grep -q "_overlayShowDelay = Duration(milliseconds: 500)" lib/services/background_service.dart
          grep -q "_overlayHideDelay = Duration(milliseconds: 300)" lib/services/background_service.dart
          grep -q "_postureDetectionTimeout = Duration(milliseconds: 1500)" lib/services/background_service.dart
          grep -q "bool userNotDetected = false" lib/services/background_service.dart
          grep -q "overlayState\['userNotDetected'\] == true" lib/services/background_service.dart
          grep -q "Icons.person_off_outlined" lib/main.dart
          grep -q "prefs.getBool('monitoring_enabled') ?? true" lib/UI/settings_page.dart

      - name: Commit PDS changes
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/background_service.dart lib/UI/dashboard.dart lib/UI/settings_page.dart lib/main.dart tooling/apply_pds_stability.py
          if git diff --cached --quiet; then
            echo 'No PDS changes to commit.'
            exit 0
          fi
          git commit -m 'Apply final PDS fixes'
          git push origin ui-overhaul-2026-08