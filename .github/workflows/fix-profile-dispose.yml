name: Fix profile dispose
on:
  push:
    branches: [ui-overhaul-2026-08]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Fix profile scroll controller dispose')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
          fetch-depth: 1
      - name: Fix dispose placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/UI/profile_page.dart')
          t = p.read_text(encoding='utf-8')

          # Remove the accidentally inserted controller disposal from any
          # unrelated State.dispose() implementation (notably the edit dialog).
          t = t.replace('    _tourScrollController.dispose();\n', '')

          # Dispose the tour controller in the actual ProfilePageState.
          marker = "  @override\n  void dispose() {\n"
          if marker in t:
              # There may already be a profile dispose; add the disposal only
              # to the first one, which belongs to ProfilePageState.
              t = t.replace(marker, marker + '    _tourScrollController.dispose();\n', 1)
          else:
              marker = "  // ---------------------------------------------------------------------------\n  // DATA\n"
              if marker not in t:
                  raise SystemExit('ProfilePageState insertion marker missing')
              block = "  @override\n  void dispose() {\n    _tourScrollController.dispose();\n    super.dispose();\n  }\n\n"
              t = t.replace(marker, block + marker, 1)

          p.write_text(t, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/UI/profile_page.dart
          git commit -m "Fix profile scroll controller dispose"
          git push origin ui-overhaul-2026-08
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-profile-dispose.yml
          git commit -m "Remove temporary profile dispose workflow"
          git push origin ui-overhaul-2026-08
