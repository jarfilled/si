name: Fix tour scroll v2
on:
  push:
    branches: [ui-overhaul-2026-08]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Fix initial tour profile settings scroll')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
          fetch-depth: 1
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/UI/profile_page.dart')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              'class ProfilePage extends StatefulWidget {\n',
              "class ProfilePage extends StatefulWidget {\n  static final GlobalKey<ProfilePageState> tourKey = GlobalKey<ProfilePageState>();\n",
              1,
          )
          t = t.replace(
              '  State<ProfilePage> createState() => _ProfilePageState();\n',
              '  State<ProfilePage> createState() => ProfilePageState();\n',
              1,
          )
          t = t.replace(
              'class _ProfilePageState extends State<ProfilePage> {\n',
              'class ProfilePageState extends State<ProfilePage> {\n',
              1,
          )
          # Attach the key to the ProfilePage instance created by MainNavigationScreen.
          # This is done in dashboard.dart below; the key gives the tour direct access to its scroll controller.
          t = t.replace(
              'class ProfilePageState extends State<ProfilePage> {\n',
              'class ProfilePageState extends State<ProfilePage> {\n  final ScrollController _tourScrollController = ScrollController();\n  final GlobalKey _tourSettingsRowKey = GlobalKey();\n',
              1,
          )
          t = t.replace(
              '  @override\n  void dispose() {\n',
              '  @override\n  void dispose() {\n    _tourScrollController.dispose();\n',
              1,
          )
          t = t.replace(
              "            child: ListView(\n              physics:",
              "            child: ListView(\n              controller: _tourScrollController,\n              physics:",
              1,
          )
          t = t.replace(
              "      key: const ValueKey<String>('tour-settings-entry'),",
              "      key: _tourSettingsRowKey,",
              1,
          )
          marker = '  Widget _action(\n'
          helper = '''  Future<void> ensureTourSettingsVisible() async {\n    if (!_tourScrollController.hasClients) return;\n    await _tourScrollController.animateTo(\n      _tourScrollController.position.maxScrollExtent,\n      duration: const Duration(milliseconds: 280),\n      curve: Curves.easeOutCubic,\n    );\n    await WidgetsBinding.instance.endOfFrame;\n  }\n\n'''
          if marker not in t: raise SystemExit('profile action marker missing')
          t = t.replace(marker, helper + marker, 1)
          p.write_text(t, encoding='utf-8')

          p = Path('lib/UI/dashboard.dart')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              '      const ProfilePage(),\n',
              '      ProfilePage(key: ProfilePage.tourKey),\n',
              1,
          )
          p.write_text(t, encoding='utf-8')

          p = Path('lib/UI/initial_tour.dart')
          t = p.read_text(encoding='utf-8')
          if "import 'profile_page.dart';" not in t:
              t = t.replace("import 'dashboard.dart';\n", "import 'dashboard.dart';\nimport 'profile_page.dart';\n", 1)
          old = '''  Future<void> _prepareStep() async {\n    if (!mounted) return;\n    setState(() {\n      _targetRect = null;\n      _targetElement = null;\n    });\n'''
          new = '''  Future<void> _prepareStep() async {\n    if (!mounted) return;\n\n    // The settings action is below the initial profile viewport. Because the\n    // profile uses a lazy ListView, its row may not exist in the element tree\n    // until we scroll. Put it on-screen before looking up the spotlight.\n    if (_index == _steps.length - 1) {\n      final profileState = ProfilePage.tourKey.currentState;\n      if (profileState != null) {\n        await profileState.ensureTourSettingsVisible();\n      }\n    }\n\n    setState(() {\n      _targetRect = null;\n      _targetElement = null;\n    });\n'''
          if old not in t: raise SystemExit('tour prepare block missing')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/UI/profile_page.dart lib/UI/dashboard.dart lib/UI/initial_tour.dart
          git commit -m "Fix initial tour profile settings scroll"
          git push origin ui-overhaul-2026-08
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-tour-scroll-v2.yml
          git commit -m "Remove temporary tour scroll workflow"
          git push origin ui-overhaul-2026-08
