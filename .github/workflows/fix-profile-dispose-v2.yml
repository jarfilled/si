name: Fix profile dispose v2
on:
  push:
    branches: [ui-overhaul-2026-08]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Fix profile controller disposal')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
          fetch-depth: 1
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/UI/profile_page.dart')
          t = p.read_text(encoding='utf-8')

          # Remove the misplaced disposal from the edit-profile dialog.
          t = t.replace('    _tourScrollController.dispose();\n', '')

          # Dispose the controller in ProfilePageState, immediately before
          # its DATA section. This avoids touching the dialog's dispose().
          class_marker = 'class ProfilePageState extends State<ProfilePage> {'
          class_pos = t.find(class_marker)
          if class_pos < 0:
              raise SystemExit('ProfilePageState marker missing')

          data_marker = "  // ---------------------------------------------------------------------------\n  // DATA\n"
          data_pos = t.find(data_marker, class_pos)
          if data_pos < 0:
              raise SystemExit('Profile DATA marker missing')

          dispose_block = "  @override\n  void dispose() {\n    _tourScrollController.dispose();\n    super.dispose();\n  }\n\n"
          # Prevent duplicate insertion if the branch already contains it.
          profile_region = t[class_pos:data_pos]
          if '_tourScrollController.dispose();' not in profile_region:
              t = t[:data_pos] + dispose_block + t[data_pos:]

          p.write_text(t, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/UI/profile_page.dart
          git commit -m "Fix profile controller disposal"
          git push origin ui-overhaul-2026-08
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-profile-dispose-v2.yml
          git commit -m "Remove temporary profile dispose v2 workflow"
          git push origin ui-overhaul-2026-08
