name: Apply PDS stability patch

on:
  push:
    branches:
      - ui-overhaul-2026-08
    paths:
      - .github/workflows/pds-stability-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
          fetch-depth: 1

      - name: Patch PDS and overlay behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # -----------------------------------------------------------------
          # background_service.dart
          # -----------------------------------------------------------------
          p = Path('lib/services/background_service.dart')
          text = p.read_text(encoding='utf-8')

          marker = "const double _lowLightThresholdLux = 100.0;"
          if '_overlayShowDelay' not in text:
              replacement = marker + """

          // Visual HUD debounce. Detection, audio and metrics remain immediate.
          const _overlayShowDelay = Duration(milliseconds: 500);
          const _overlayHideDelay = Duration(milliseconds: 300);
          const _postureDetectionTimeout = Duration(milliseconds: 1500);"""
              text = text.replace(marker, replacement, 1)

          marker = """  bool stopped = false;
  bool nsfwOverlayActive = false;"""
          if 'bool userNotDetected = false;' not in text:
              replacement = marker + """

          // The camera may temporarily lose the person. In that state no
          // camera-derived warning is allowed to remain active.
          bool userNotDetected = false;
          DateTime? lastNeckSignalAt;
          DateTime? lastHunchSignalAt;
          Timer? postureDetectionWatchdog;"""
              if marker not in text:
                  raise SystemExit('service-state marker not found')
              text = text.replace(marker, replacement, 1)

          overlay_marker = """  final overlayState =
  <String, dynamic>{"""
          if 'pendingOverlayTimers' not in text:
              helper = r'''  // Pending visual transitions. This prevents single-frame posture noise
  // from opening and closing the overlay repeatedly.
  final pendingOverlayTimers = <String, Timer?>{};

  void _cancelPendingOverlayTimer(String key) {
    pendingOverlayTimers[key]?.cancel();
    pendingOverlayTimers[key] = null;
  }

  bool _readUserDetected(Map<dynamic, dynamic> data) {
    const notDetectedKeys = <String>[
      'userNotDetected',
      'user_not_detected',
      'notDetected',
      'not_detected',
      'noUser',
      'no_user',
    ];

    for (final key in notDetectedKeys) {
      final value = data[key];
      if (value is bool) return !value;
    }

    const detectedKeys = <String>[
      'userDetected',
      'user_detected',
      'detected',
      'personDetected',
      'person_detected',
      'poseDetected',
      'pose_detected',
      'hasUser',
      'has_user',
    ];

    for (final key in detectedKeys) {
      final value = data[key];
      if (value is bool) return value;
    }

    final status = data['status']?.toString().trim().toLowerCase();
    if (status != null) {
      const lostStatuses = <String>{
        'not_detected',
        'not detected',
        'undetected',
        'no_user',
        'no user',
        'no_person',
        'no person',
        'no_pose',
        'no pose',
        'lost',
        'missing',
      };
      if (lostStatuses.contains(status)) return false;
    }

    // Existing streams already represent valid posture results when they do
    // not expose a separate detection flag.
    return true;
  }

  void _clearCameraWarningsForLostUser() {
    for (final type in const ['neck', 'hunch', 'tooClose']) {
      updateWarningState(type, false);
      _cancelPendingOverlayTimer(type);
      overlayState[type] = false;
    }

    unawaited(metrics.stop('neck'));
    unawaited(metrics.stop('hunch'));
    unawaited(metrics.stop('tooClose'));
  }

  void _setUserNotDetected(bool value) {
    if (userNotDetected == value) return;

    userNotDetected = value;

    if (value) {
      _clearCameraWarningsForLostUser();
    }

    overlayState['userNotDetected'] = value;
    queueOverlayUpdate();
  }

  void _startPostureDetectionWatchdog() {
    postureDetectionWatchdog?.cancel();
    postureDetectionWatchdog = Timer.periodic(
      const Duration(milliseconds: 500),
      (_) {
        if (stopped) return;

        final now = DateTime.now();
        final neckStale = lastNeckSignalAt == null ||
            now.difference(lastNeckSignalAt!) > _postureDetectionTimeout;
        final hunchStale = lastHunchSignalAt == null ||
            now.difference(lastHunchSignalAt!) > _postureDetectionTimeout;

        // Only declare the camera user missing when both posture channels have
        // gone quiet. A healthy stream from either detector keeps the session
        // valid.
        if (neckStale && hunchStale) {
          _setUserNotDetected(true);
        }
      },
    );
  }

  void _setOverlayWarningDebounced(String key, bool value) {
    final current = overlayState[key] == true;

    if (current == value) {
      _cancelPendingOverlayTimer(key);
      return;
    }

    _cancelPendingOverlayTimer(key);

    pendingOverlayTimers[key] = Timer(
      value ? _overlayShowDelay : _overlayHideDelay,
      () {
        pendingOverlayTimers[key] = null;
        if (stopped) return;

        overlayState[key] = value;
        queueOverlayUpdate();
      },
    );
  }

'''
              if overlay_marker not in text:
                  raise SystemExit('overlay-state marker not found')
              text = text.replace(overlay_marker, helper + overlay_marker, 1)

          if "'userNotDetected': false" not in text:
              text = text.replace(
                  "    'lowLight': false,\n    'wristTilt': 0.0,",
                  "    'lowLight': false,\n    'userNotDetected': false,\n    'wristTilt': 0.0,",
                  1,
              )

          # Replace only the existing setOverlayFlag implementation.
          start = text.find('  void setOverlayFlag(')
          shutdown_marker = '\n  // ==========================================================================\n  // SHUTDOWN'
          end = text.find(shutdown_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('setOverlayFlag block not found')

          new_set_overlay = r'''  void setOverlayFlag(
      String key,
      bool value, {
        double? wristTilt,
        double? hunchRatio,
        double? lightLux,
      }) {
    if (wristTilt != null) {
      overlayState['wristTilt'] = wristTilt;
    }

    if (hunchRatio != null) {
      overlayState['hunchRatio'] = hunchRatio;
    }

    if (lightLux != null) {
      overlayState['lightLux'] = lightLux;
    }

    if (key == 'userNotDetected') {
      _cancelPendingOverlayTimer(key);
      overlayState[key] = value;
      queueOverlayUpdate();
      return;
    }

    const warningKeys = <String>{
      'tooClose',
      'neck',
      'wrist',
      'hunch',
      'lowLight',
    };

    if (warningKeys.contains(key)) {
      _setOverlayWarningDebounced(key, value);
      return;
    }

    queueOverlayUpdate();
  }
'''
          text = text[:start] + new_set_overlay + text[end:]

          if 'postureDetectionWatchdog?.cancel();' not in text:
              marker = """    pushTimer?.cancel();
    emailTimer?.cancel();"""
              replacement = """    pushTimer?.cancel();
    emailTimer?.cancel();
    postureDetectionWatchdog?.cancel();

    for (final timer in pendingOverlayTimers.values) {
      timer?.cancel();
    }
    pendingOverlayTimers.clear();"""
              if marker not in text:
                  raise SystemExit('shutdown timer marker not found')
              text = text.replace(marker, replacement, 1)

          if '_startPostureDetectionWatchdog();' not in text:
              marker = """  // ==========================================================================\n  // NETWORK SYNC\n  // ==========================================================================\n\n  syncService.start();"""
              replacement = """  // ==========================================================================\n  // POSTURE DETECTION WATCHDOG\n  // ==========================================================================\n\n  _startPostureDetectionWatchdog();\n\n  // ==========================================================================\n  // NETWORK SYNC\n  // ==========================================================================\n\n  syncService.start();"""
              if marker not in text:
                  raise SystemExit('network-sync marker not found')
              text = text.replace(marker, replacement, 1)

          # Neck stream detection guard.
          neck_marker = """          final data =
          Map<dynamic, dynamic>.from(
            raw,
          );

          final status ="""
          neck_replacement = """          final data =
          Map<dynamic, dynamic>.from(
            raw,
          );

          lastNeckSignalAt = DateTime.now();
          final detected = _readUserDetected(data);
          if (!detected) {
            _setUserNotDetected(true);
            return;
          }
          if (userNotDetected) {
            _setUserNotDetected(false);
          }

          final status ="""
          if 'lastNeckSignalAt = DateTime.now();' not in text:
              if neck_marker not in text:
                  raise SystemExit('neck stream marker not found')
              text = text.replace(neck_marker, neck_replacement, 1)

          # Hunch stream detection guard.
          hunch_marker = """          final data =
          Map<dynamic, dynamic>.from(
            raw,
          );

          final isHunching ="""
          hunch_replacement = """          final data =
          Map<dynamic, dynamic>.from(
            raw,
          );

          lastHunchSignalAt = DateTime.now();
          final detected = _readUserDetected(data);
          if (!detected) {
            _setUserNotDetected(true);
            return;
          }
          if (userNotDetected) {
            _setUserNotDetected(false);
          }

          final isHunching ="""
          if 'lastHunchSignalAt = DateTime.now();' not in text:
              if hunch_marker not in text:
                  raise SystemExit('hunch stream marker not found')
              text = text.replace(hunch_marker, hunch_replacement, 1)

          # Add the new state to both status payload shapes.
          text = text.replace(
              """              'monitoringSoundEnabled':
              monitoringSoundEnabled,
            },""",
              """              'monitoringSoundEnabled':
              monitoringSoundEnabled,
              'userNotDetected':
              userNotDetected,
            },""",
              1,
          )
          text = text.replace(
              """          'monitoringSoundEnabled':
          monitoringSoundEnabled,
        },""",
              """          'monitoringSoundEnabled':
          monitoringSoundEnabled,
          'userNotDetected':
          userNotDetected,
        },""",
              1,
          )

          p.write_text(text, encoding='utf-8')

          # -----------------------------------------------------------------
          # dashboard.dart — activate PDS by default after calibration.
          # -----------------------------------------------------------------
          p = Path('lib/UI/dashboard.dart')
          text = p.read_text(encoding='utf-8')

          if "../services/app_permission_manager.dart" not in text:
              text = text.replace(
                  "import '../services/background_service.dart';\n",
                  "import '../services/app_permission_manager.dart';\nimport '../services/background_service.dart';\n",
                  1,
              )

          if "const _cameraChannel = 'com.s_health/camera_control';" not in text:
              marker = "  static const Color subtext = Color(0xFF7D8D89);\n"
              text = text.replace(
                  marker,
                  marker + "  static const _cameraChannel = 'com.s_health/camera_control';\n",
                  1,
              )

          if '_ensureDefaultMonitoring();' not in text:
              marker = """    _listenToService();
    _refreshMonitoringState();"""
              replacement = """    _listenToService();
    _refreshMonitoringState();
    _ensureDefaultMonitoring();"""
              if marker not in text:
                  raise SystemExit('dashboard startup marker not found')
              text = text.replace(marker, replacement, 1)

              marker = "  void _goTo(int index) {"
              helper = r'''  Future<void> _ensureDefaultMonitoring() async {
    try {
      final prefs = await SharedPreferences.getInstance();
      await prefs.reload();

      final configured = prefs.getBool('monitoring_enabled');
      if (configured == false) {
        return;
      }

      // A missing value is a fresh/default install. Opt the user into PDS.
      if (configured == null) {
        await prefs.setBool('monitoring_enabled', true);
      }

      final divisor = prefs.getDouble('hunch_divisor');
      if (divisor == null || !divisor.isFinite || divisor <= 0) {
        return;
      }

      if (await BackgroundMonitorService.isRunning) {
        return;
      }

      final permissions =
          await AppPermissionManager.ensureMonitoringPermissions();
      if (!permissions) {
        return;
      }

      const channel = MethodChannel(_cameraChannel);

      await channel.invokeMethod(
        'saveHunchDivisor',
        {'hunch_divisor': divisor},
      );

      await channel.invokeMethod(
        'startCamera',
        {'hunch_divisor': divisor},
      );

      await BackgroundMonitorService.initialize();
      BackgroundMonitorService.start();

      if (mounted) {
        setState(() => serviceAlive = true);
      }
    } catch (e, stackTrace) {
      debugPrint('[Dashboard] Default PDS startup failed: $e');
      debugPrintStack(stackTrace: stackTrace);
    }
  }

'''
              if marker not in text:
                  raise SystemExit('dashboard _goTo marker not found')
              text = text.replace(marker, helper + marker, 1)

              old_comment = re.compile(
                  r"    // We ONLY observe the monitoring service here\..*?    // Monitoring must be explicitly started elsewhere by the user\.\n\n",
                  re.S,
              )
              text = old_comment.sub(
                  "    // PDS is enabled by default for a fresh setup, but an explicit OFF choice is respected.\n    // Startup waits for calibration and camera permission before starting the service.\n\n",
                  text,
                  count=1,
              )

          p.write_text(text, encoding='utf-8')

          # -----------------------------------------------------------------
          # main.dart — unique not-detected indicator.
          # -----------------------------------------------------------------
          p = Path('lib/main.dart')
          text = p.read_text(encoding='utf-8')

          if '_showUserNotDetected' not in text:
              marker = "  bool _showLowLight = false;\n  bool _showNsfw = false;"
              replacement = "  bool _showLowLight = false;\n  bool _showUserNotDetected = false;\n  bool _showNsfw = false;"
              if marker not in text:
                  raise SystemExit('main overlay state marker not found')
              text = text.replace(marker, replacement, 1)

              marker = "          _showLowLight = readBool('lowLight') || readBool('lowLightPoor');\n\n          if (type == 'nsfw') {"
              replacement = "          _showLowLight = readBool('lowLight') || readBool('lowLightPoor');\n          _showUserNotDetected = readBool('userNotDetected');\n\n          if (type == 'nsfw') {"
              if marker not in text:
                  raise SystemExit('main overlay listener marker not found')
              text = text.replace(marker, replacement, 1)

              marker = """                    if (_showWrist)
                      _indicatorCircle(Icons.pan_tool, Colors.purple),
"""
              replacement = """                    if (_showWrist)
                      _indicatorCircle(Icons.pan_tool, Colors.purple),
                    if (_showUserNotDetected)
                      _indicatorCircle(Icons.person_off_outlined, Colors.blueGrey),
"""
              if marker not in text:
                  raise SystemExit('main indicator marker not found')
              text = text.replace(marker, replacement, 1)

              marker = """            _showLowLight = false;
          });"""
              replacement = """            _showLowLight = false;
            _showUserNotDetected = false;
          });"""
              if marker in text:
                  text = text.replace(marker, replacement, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch markers
        shell: bash
        run: |
          grep -q "_overlayShowDelay" lib/services/background_service.dart
          grep -q "userNotDetected" lib/services/background_service.dart
          grep -q "_ensureDefaultMonitoring" lib/UI/dashboard.dart
          grep -q "_showUserNotDetected" lib/main.dart
          grep -q "person_off_outlined" lib/main.dart

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/background_service.dart lib/UI/dashboard.dart lib/main.dart
          git diff --cached --check
          git commit -m 'Apply PDS stability changes'
          git push origin ui-overhaul-2026-08
