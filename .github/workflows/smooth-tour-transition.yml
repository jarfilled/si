name: Smooth initial tour transitions

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
          fetch-depth: 0

      - name: Patch tour animation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/UI/initial_tour.dart')
          s = p.read_text(encoding='utf-8')

          def r(old, new, name):
              global s
              if old not in s:
                  raise SystemExit(f'missing block: {name}')
              s = s.replace(old, new, 1)

          r('class _InitialTourOverlayState extends State<_InitialTourOverlay> {', 'class _InitialTourOverlayState extends State<_InitialTourOverlay> with SingleTickerProviderStateMixin {', 'mixin')
          r('  int _index = 0;\n  Rect? _targetRect;\n  Element? _targetElement;\n  bool _busy = false;', '''  int _index = 0;
  Rect? _targetRect;
  Element? _targetElement;
  bool _busy = false;

  late final AnimationController _spotlightController;
  late final Animation<double> _spotlightAnimation;
  Rect? _fromRect;
  Rect? _toRect;''', 'fields')
          r("  void initState() {\n    super.initState();\n    final female = widget.userGender == 'female';", '''  void initState() {
    super.initState();

    _spotlightController = AnimationController(
      vsync: this,
      duration: const Duration(milliseconds: 220),
    );
    _spotlightAnimation = CurvedAnimation(
      parent: _spotlightController,
      curve: Curves.easeOutCubic,
    );

    final female = widget.userGender == 'female';''', 'controller init')

          start = s.index('  Future<void> _prepareStep() async {')
          end = s.index('  void _calculateTarget() {', start)
          s = s[:start] + '''  Future<void> _prepareStep() async {
    if (!mounted) return;

    // Keep the current spotlight alive while the underlying page changes.
    if (_index == _steps.length - 1) {
      final profileState = ProfilePage.tourKey.currentState;
      if (profileState != null) {
        await profileState.ensureTourSettingsVisible();
      }
      await WidgetsBinding.instance.endOfFrame;
    }

    _targetElement = null;
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (mounted) _calculateTarget();
    });
  }

''' + s[end:]

          r('''    if (!mounted) return;
    setState(() {
      _targetElement = renderElement;
      _targetRect = rect;
    });
  }
''', '''    if (!mounted) return;

    _targetElement = renderElement;
    _targetRect = rect;

    final currentRect = _fromRect == null || _toRect == null
        ? null
        : (_spotlightAnimation.value >= 0.999
            ? _toRect
            : Rect.lerp(_fromRect, _toRect, _spotlightAnimation.value));

    if (currentRect == null) {
      _fromRect = rect;
      _toRect = rect;
      _spotlightController.value = 1;
    } else {
      _fromRect = currentRect;
      _toRect = rect;
      _spotlightController.forward(from: 0);
    }

    setState(() {});
  }
''', 'target update')

          r('''      if (step.target == _TourTarget.navigation) {
        final activated = await _invokeTargetTap();
        if (!activated) {
          debugPrint('[InitialTour] Navigation target was not activated.');
          return;
        }
        await WidgetsBinding.instance.endOfFrame;
        await Future<void>.delayed(const Duration(milliseconds: 280));
      } else if (step.settingsEntry) {
        final activated = await _invokeTargetTap();
        if (!activated) {
          debugPrint('[InitialTour] Settings target was not activated.');
          return;
        }
        await Future<void>.delayed(const Duration(milliseconds: 350));
        await widget.onSettingsOpened();
        return;
      }
''', '''      if (step.target == _TourTarget.navigation) {
        final activated = await _invokeTargetTap();
        if (!activated) {
          debugPrint('[InitialTour] Navigation target was not activated.');
          return;
        }
        await WidgetsBinding.instance.endOfFrame;
      } else if (step.settingsEntry) {
        final activated = await _invokeTargetTap();
        if (!activated) {
          debugPrint('[InitialTour] Settings target was not activated.');
          return;
        }
        await widget.onSettingsOpened();
        return;
      }
''', 'waits')

          r('''      setState(() {
        _index++;
        _targetRect = null;
        _targetElement = null;
      });
      await _prepareStep();
''', '''      setState(() {
        _index++;
        _targetElement = null;
      });
      await _prepareStep();
''', 'advance')

          r('''    if (w is InkWell && w.onTap != null) {
      w.onTap!();
      await Future<void>.delayed(const Duration(milliseconds: 100));
      return true;
    }
''', '''    if (w is InkWell && w.onTap != null) {
      w.onTap!();
      return true;
    }
''', 'invoke tap')

          start = s.index('  @override\n  Widget build(BuildContext context) {', s.index('  Future<void> _skip'))
          end = s.index('  Widget _buildHint(Size size, _TourStep step) {', start)
          s = s[:start] + '''  @override
  Widget build(BuildContext context) {
    final size = MediaQuery.sizeOf(context);
    final step = _steps[_index];
    return Material(
      type: MaterialType.transparency,
      child: AnimatedBuilder(
        animation: _spotlightAnimation,
        builder: (context, _) {
          final animatedRect = _fromRect == null || _toRect == null
              ? _targetRect
              : Rect.lerp(_fromRect, _toRect, _spotlightAnimation.value);
          return Stack(
            children: [
              Positioned.fill(
                child: CustomPaint(
                  painter: _TourSpotlightPainter(targetRect: animatedRect),
                ),
              ),
              Positioned.fill(
                child: GestureDetector(
                  behavior: HitTestBehavior.opaque,
                  onTapUp: _handleOverlayTap,
                  child: const SizedBox.expand(),
                ),
              ),
              _buildHint(size, step, animatedRect),
            ],
          );
        },
      ),
    );
  }

'''+s[end:]

          r('  Widget _buildHint(Size size, _TourStep step) {', '  Widget _buildHint(Size size, _TourStep step, Rect? animatedRect) {', 'hint signature')
          r('''    final top = _targetRect == null
        ? (size.height - 205.0) / 2.0
        : (_targetRect!.top > size.height * .55
            ? (_targetRect!.top - 225).clamp(20.0, maxTop).toDouble()
            : (_targetRect!.bottom + 18).clamp(20.0, maxTop).toDouble());
''', '''    final top = animatedRect == null
        ? (size.height - 205.0) / 2.0
        : (animatedRect.top > size.height * .55
            ? (animatedRect.top - 225).clamp(20.0, maxTop).toDouble()
            : (animatedRect.bottom + 18).clamp(20.0, maxTop).toDouble());
''', 'hint position')

          r('  Future<void> _skip() async {', '''  @override
  void dispose() {
    _spotlightController.dispose();
    super.dispose();
  }

  Future<void> _skip() async {''', 'dispose')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          grep -q 'SingleTickerProviderStateMixin' lib/UI/initial_tour.dart
          grep -q 'AnimatedBuilder' lib/UI/initial_tour.dart
          grep -q 'Rect.lerp(_fromRect, _toRect' lib/UI/initial_tour.dart
          ! grep -q 'Future<void>.delayed(const Duration(milliseconds: 280))' lib/UI/initial_tour.dart
          ! grep -q 'Future<void>.delayed(const Duration(milliseconds: 180))' lib/UI/initial_tour.dart
          echo 'Tour transition patch verified.'

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/UI/initial_tour.dart
          git commit -m 'Smooth initial tour transitions'
          git push origin ui-overhaul-2026-08
          git rm .github/workflows/smooth-tour-transition.yml
          git commit -m 'Remove temporary tour patch workflow'
          git push origin ui-overhaul-2026-08
