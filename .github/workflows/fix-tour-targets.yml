name: Fix tour targets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
          fetch-depth: 1
      - name: Patch tour targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dashboard = Path('lib/UI/dashboard.dart')
          text = dashboard.read_text(encoding='utf-8')
          old = """              return Expanded(\n                child: InkWell(\n                  onTap: () => _goTo(index),\n"""
          new = """              return Expanded(\n                child: InkWell(\n                  key: ValueKey<String>('tour-nav-${item.label}'),\n                  onTap: () => _goTo(index),\n"""
          if old not in text:
              raise SystemExit('dashboard nav block not found')
          text = text.replace(old, new, 1)
          dashboard.write_text(text, encoding='utf-8')

          profile = Path('lib/UI/profile_page.dart')
          text = profile.read_text(encoding='utf-8')
          old = """          _action(\n            Icons.settings_outlined,\n            'تنظیمات پایش',\n            'دوربین، هشدارها و محافظت از محتوا',\n            _openSettings,\n          ),\n"""
          new = """          _tourSettingsAction(),\n"""
          if old not in text:
              raise SystemExit('profile settings action block not found')
          text = text.replace(old, new, 1)
          marker = """  Widget _action(\n      IconData icon,\n"""
          helper = """  Widget _tourSettingsAction() {\n    return InkWell(\n      key: const ValueKey<String>('tour-settings-entry'),\n      onTap: _openSettings,\n      borderRadius: BorderRadius.circular(15),\n      child: Row(\n        children: [\n          Container(\n            width: 42,\n            height: 42,\n            decoration: const BoxDecoration(\n              color: mint,\n              shape: BoxShape.circle,\n            ),\n            child: const Icon(\n              Icons.settings_outlined,\n              color: green,\n            ),\n          ),\n          const SizedBox(width: 12),\n          const Expanded(\n            child: Column(\n              crossAxisAlignment: CrossAxisAlignment.start,\n              children: [\n                Text(\n                  'تنظیمات پایش',\n                  style: TextStyle(\n                    color: text,\n                    fontSize: 13,\n                    fontWeight: FontWeight.w900,\n                  ),\n                ),\n                SizedBox(height: 3),\n                Text(\n                  'دوربین، هشدارها و محافظت از محتوا',\n                  maxLines: 1,\n                  overflow: TextOverflow.ellipsis,\n                  style: TextStyle(\n                    color: subtext,\n                    fontSize: 10,\n                  ),\n                ),\n              ],\n            ),\n          ),\n          const Icon(\n            Icons.chevron_left_rounded,\n            color: subtext,\n          ),\n        ],\n      ),\n    );\n  }\n\n"""
          if marker not in text:
              raise SystemExit('profile action marker not found')
          text = text.replace(marker, helper + marker, 1)
          profile.write_text(text, encoding='utf-8')

          tour = Path('lib/UI/initial_tour.dart')
          text = tour.read_text(encoding='utf-8')

          text = text.replace("  final bool settingsEntry;\n", "  final bool settingsEntry;\n  final String? keyTarget;\n", 1)
          text = text.replace("    this.settingsEntry = false,\n", "    this.settingsEntry = false,\n    this.keyTarget,\n", 1)

          text = text.replace(
              "        textTarget: 'بدن',\n",
              "        keyTarget: 'tour-nav-بدن',\n", 1)
          text = text.replace(
              "        textTarget: 'ورزش',\n",
              "        keyTarget: 'tour-nav-ورزش',\n", 1)
          text = text.replace(
              "          textTarget: 'بانوان',\n",
              "          keyTarget: 'tour-nav-بانوان',\n", 1)
          text = text.replace(
              "        textTarget: 'پروفایل',\n",
              "        keyTarget: 'tour-nav-پروفایل',\n", 1)
          text = text.replace(
              "        textTarget: 'تنظیمات پایش',\n",
              "        keyTarget: 'tour-settings-entry',\n", 1)

          old = """    Element? element;\n    if (step.iconTarget != null) {\n      element = _findIconElement(step.iconTarget!);\n    } else if (step.textTarget != null) {\n      element = _findTextElement(step.textTarget!, prefix: step.textPrefix);\n    }\n"""
          new = """    Element? element;\n    if (step.keyTarget != null) {\n      element = _findElementByKey(step.keyTarget!);\n    } else if (step.iconTarget != null) {\n      element = _findIconElement(step.iconTarget!);\n    } else if (step.textTarget != null) {\n      element = _findTextElement(step.textTarget!, prefix: step.textPrefix);\n    }\n"""
          if old not in text:
              raise SystemExit('tour target resolution block not found')
          text = text.replace(old, new, 1)

          marker = """  Element? _findTextElement(String target, {String? prefix}) {\n"""
          helper = """  Element? _findElementByKey(String value) {\n    Element? found;\n\n    void visit(Element element) {\n      if (found != null) return;\n      final key = element.widget.key;\n      if (key is ValueKey<String> && key.value == value) {\n        found = element;\n        return;\n      }\n      element.visitChildElements(visit);\n    }\n\n    widget.hostContext.visitChildElements(visit);\n    return found;\n  }\n\n"""
          if marker not in text:
              raise SystemExit('tour text finder marker not found')
          text = text.replace(marker, helper + marker, 1)

          tour.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/UI/dashboard.dart lib/UI/profile_page.dart lib/UI/initial_tour.dart
          git commit -m "Fix initial tour profile and settings targets"
          git push origin ui-overhaul-2026-08
      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-tour-targets.yml
          git commit -m "Remove temporary tour fix workflow"
          git push origin ui-overhaul-2026-08
