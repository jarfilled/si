name: Improve permission status feedback
on:
  push:
    branches: [ui-overhaul-2026-08, womens-sharing-integration-2026-09]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Apply permission status feedback') && !contains(github.event.head_commit.message, 'Remove temporary permission status workflow') && !contains(github.event.head_commit.message, 'Integrate women health daily sharing')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Patch settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/UI/settings_page.dart')
          text = p.read_text(encoding='utf-8')

          if "package:permission_handler/permission_handler.dart" not in text:
              text = text.replace(
                  "import 'package:flutter_overlay_window/flutter_overlay_window.dart';\n",
                  "import 'package:flutter_overlay_window/flutter_overlay_window.dart';\nimport 'package:permission_handler/permission_handler.dart';\n",
                  1,
              )

          old_camera = '''                          _action(
                            Icons.camera_alt_outlined,
                            'مجوز دوربین',
                            'برای پایش گردن، قوز و فاصله',
                            () async {
                              final granted =
                                  await AppPermissionManager.ensureMonitoringPermissions();
                              if (!granted) {
                                _toast('اجازه دوربین داده نشده است.');
                              }
                            },
                          ),'''
          new_camera = '''                          _action(
                            Icons.camera_alt_outlined,
                            'مجوز دوربین',
                            'برای پایش گردن، قوز و فاصله',
                            () async {
                              final status = await Permission.camera.status;
                              if (status.isGranted) {
                                _toast('مجوز دوربین قبلاً فعال است.');
                                return;
                              }

                              final granted =
                                  await AppPermissionManager.ensureMonitoringPermissions();
                              _toast(
                                granted
                                    ? 'مجوز دوربین فعال شد.'
                                    : 'اجازه دوربین داده نشده است.',
                              );
                            },
                          ),'''
          if old_camera not in text:
              raise SystemExit('camera permission block not found')
          text = text.replace(old_camera, new_camera, 1)

          old_overlay = '''                          _action(
                            Icons.layers_outlined,
                            'مجوز نمایش روی سایر برنامه‌ها',
                            'برای هشدارهای شناور',
                            () async {
                              final granted =
                                  await AppPermissionManager.ensureOverlayPermission();
                              if (!granted) {
                                _toast(
                                  'اجازه نمایش روی سایر برنامه‌ها داده نشده است.',
                                );
                              }
                            },
                          ),'''
          new_overlay = '''                          _action(
                            Icons.layers_outlined,
                            'مجوز نمایش روی سایر برنامه‌ها',
                            'برای هشدارهای شناور',
                            () async {
                              final status =
                                  await FlutterOverlayWindow.isPermissionGranted();
                              if (status) {
                                _toast(
                                  'مجوز نمایش روی سایر برنامه‌ها قبلاً فعال است.',
                                );
                                return;
                              }

                              final granted =
                                  await AppPermissionManager.ensureOverlayPermission();
                              if (granted) {
                                _toast(
                                  'مجوز نمایش روی سایر برنامه‌ها فعال شد.',
                                );
                              } else {
                                permissionPending = true;
                                _toast(
                                  'اجازه نمایش روی سایر برنامه‌ها داده نشده است.',
                                );
                              }
                            },
                          ),'''
          if old_overlay not in text:
              raise SystemExit('overlay permission block not found')
          text = text.replace(old_overlay, new_overlay, 1)

          old_notification = '''                          _action(
                            Icons.notifications_none_rounded,
                            'مجوز اعلان‌ها',
                            'برای اعلان سرویس پایش',
                            () async {
                              await AppPermissionManager.ensureMonitoringPermissions();
                            },
                          ),'''
          new_notification = '''                          _action(
                            Icons.notifications_none_rounded,
                            'مجوز اعلان‌ها',
                            'برای اعلان سرویس پایش',
                            () async {
                              final status = await Permission.notification.status;
                              if (status.isGranted) {
                                _toast('مجوز اعلان‌ها قبلاً فعال است.');
                                return;
                              }

                              final granted =
                                  await AppPermissionManager.ensureNotificationPermission();
                              _toast(
                                granted
                                    ? 'مجوز اعلان‌ها فعال شد.'
                                    : 'اجازه اعلان‌ها داده نشده است.',
                              );
                            },
                          ),'''
          if old_notification not in text:
              raise SystemExit('notification permission block not found')
          text = text.replace(old_notification, new_notification, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          grep -q "مجوز دوربین قبلاً فعال است" lib/UI/settings_page.dart
          grep -q "مجوز نمایش روی سایر برنامه‌ها قبلاً فعال است" lib/UI/settings_page.dart
          grep -q "مجوز اعلان‌ها قبلاً فعال است" lib/UI/settings_page.dart
          grep -q "ensureNotificationPermission" lib/UI/settings_page.dart

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/UI/settings_page.dart
          git commit -m 'Apply permission status feedback'
          git push origin ui-overhaul-2026-08
          git rm .github/workflows/fix-permission-status.yml
          git commit -m 'Remove temporary permission status workflow'
          git push origin ui-overhaul-2026-08

  women-sharing:
    if: "contains(github.event.head_commit.message, 'Trigger women sharing patch')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: womens-sharing-integration-2026-09
          fetch-depth: 2

      - name: Patch women health page
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/UI/womens_health_page.dart')
          text = path.read_text(encoding='utf-8')

          import_marker = "import 'package:shamsi_date/shamsi_date.dart';"
          import_add = "import 'package:shamsi_date/shamsi_date.dart';\n\nimport '../services/womens_health_sharing_service.dart';\nimport 'womens_health_sharing_card.dart';"
          if "womens_health_sharing_service.dart" not in text:
              if import_marker not in text:
                  raise SystemExit('Import marker not found; aborting.')
              text = text.replace(import_marker, import_add, 1)

          save_marker = "      await _loadHealthData();\n\n      if (!mounted) return;\n\n      FocusScope.of(context).unfocus();"
          save_replacement = """      try {
        final sent = await WomensHealthSharingService.instance.sendDailyReport(
          date: dateString,
          mood: mood,
          pain: pain,
        );

        if (sent > 0) {
          debugPrint('[WomensHealthPage] Daily mood/pain report sent to $sent contact(s).');
        }
      } catch (e) {
        // Saving the health entry must remain independent from email delivery.
        debugPrint('[WomensHealthPage] Daily sharing failed: $e');
      }

      await _loadHealthData();

      if (!mounted) return;

      FocusScope.of(context).unfocus();"""
          if "Daily mood/pain report sent" not in text:
              if save_marker not in text:
                  raise SystemExit('Daily save marker not found; aborting.')
              text = text.replace(save_marker, save_replacement, 1)

          card_marker = "                      _socialCard(),\n                      const SizedBox(height: 20),"
          card_replacement = """                      _socialCard(),
                      const SizedBox(height: 12),
                      const WomensHealthSharingCard(),
                      const SizedBox(height: 20),"""
          if "const WomensHealthSharingCard()" not in text:
              if card_marker not in text:
                  raise SystemExit('Build card marker not found; aborting.')
              text = text.replace(card_marker, card_replacement, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verify targeted integration
        run: |
          grep -q "womens_health_sharing_service.dart" lib/UI/womens_health_page.dart
          grep -q "const WomensHealthSharingCard()" lib/UI/womens_health_page.dart
          grep -q "sendDailyReport" lib/UI/womens_health_page.dart

      - name: Remove temporary files and restore baseline workflow
        run: |
          git checkout HEAD~1 -- .github/workflows/fix-permission-status.yml
          rm -f .womens-sharing-patch-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/UI/womens_health_page.dart .github/workflows/fix-permission-status.yml
          git add -u .womens-sharing-patch-trigger
          git commit -m 'Integrate women health daily sharing'
          git push origin womens-sharing-integration-2026-09
