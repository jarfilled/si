name: PDS stability v4
on:
  push:
    branches:
      - ui-overhaul-2026-08
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Apply PDS stability changes v4') && !contains(github.event.head_commit.message, 'Remove PDS stability v4 workflow')"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
      - name: Patch files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return s
              if old not in s:
                  raise SystemExit(f'{label}: marker not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              return s

          # Background service timing constants.
          replace_once(
              'lib/services/background_service.dart',
              "const double _lowLightThresholdLux = 100.0;",
              """const double _lowLightThresholdLux = 100.0;
const _overlayShowDelay = Duration(milliseconds: 500);
const _overlayHideDelay = Duration(milliseconds: 300);
const _postureDetectionTimeout = Duration(milliseconds: 1500);""",
              'thresholds',
          )

          p = Path('lib/services/background_service.dart')
          s = p.read_text(encoding='utf-8')

          state_old = """  bool stopped = false;
  bool nsfwOverlayActive = false;

  String monitoringMode = 'passive';"""
          state_new = """  bool stopped = false;
  bool nsfwOverlayActive = false;

  bool userNotDetected = false;
  DateTime? lastNeckSignalAt;
  DateTime? lastHunchSignalAt;
  Timer? postureDetectionWatchdog;

  String monitoringMode = 'passive';"""
          if 'bool userNotDetected = false;' not in s:
              if state_old not in s:
                  raise SystemExit('service state marker not found')
              s = s.replace(state_old, state_new, 1)

          if 'final pendingOverlayTimers' not in s:
              marker = "  final overlayState =\n  <String, dynamic>{"
              helpers = r'''  final pendingOverlayTimers = <String, Timer?>{};

  void _cancelPendingOverlayTimer(String key) {
    pendingOverlayTimers[key]?.cancel();
    pendingOverlayTimers[key] = null;
  }

  bool _readUserDetected(Map<dynamic, dynamic> data) {
    for (final key in const [
      'userNotDetected',
      'user_not_detected',
      'notDetected',
      'not_detected',
      'noUser',
      'no_user',
    ]) {
      final value = data[key];
      if (value is bool) return !value;
    }

    for (final key in const [
      'userDetected',
      'user_detected',
      'detected',
      'personDetected',
      'person_detected',
      'poseDetected',
      'pose_detected',
      'hasUser',
      'has_user',
    ]) {
      final value = data[key];
      if (value is bool) return value;
    }

    final status = data['status']?.toString().trim().toLowerCase();
    if (status != null && const {
      'not_detected',
      'not detected',
      'undetected',
      'no_user',
      'no user',
      'no_person',
      'no person',
      'no_pose',
      'no pose',
      'lost',
      'missing',
    }.contains(status)) {
      return false;
    }

    return true;
  }

  void _clearCameraWarningsForLostUser() {
    for (final type in const ['neck', 'hunch', 'tooClose']) {
      updateWarningState(type, false);
      _cancelPendingOverlayTimer(type);
      overlayState[type] = false;
    }
    unawaited(metrics.stop('neck'));
    unawaited(metrics.stop('hunch'));
    unawaited(metrics.stop('tooClose'));
  }

  void _setUserNotDetected(bool value) {
    if (userNotDetected == value) return;
    userNotDetected = value;
    overlayState['userNotDetected'] = value;
    if (value) _clearCameraWarningsForLostUser();
    queueOverlayUpdate();
  }

  void _startPostureDetectionWatchdog() {
    postureDetectionWatchdog?.cancel();
    postureDetectionWatchdog = Timer.periodic(
      const Duration(milliseconds: 500),
      (_) {
        if (stopped) return;
        final now = DateTime.now();
        final neckStale = lastNeckSignalAt == null ||
            now.difference(lastNeckSignalAt!) > _postureDetectionTimeout;
        final hunchStale = lastHunchSignalAt == null ||
            now.difference(lastHunchSignalAt!) > _postureDetectionTimeout;
        if (neckStale && hunchStale) _setUserNotDetected(true);
      },
    );
  }

  void _setOverlayWarningDebounced(String key, bool value) {
    final current = overlayState[key] == true;
    if (current == value) {
      _cancelPendingOverlayTimer(key);
      return;
    }
    _cancelPendingOverlayTimer(key);
    pendingOverlayTimers[key] = Timer(
      value ? _overlayShowDelay : _overlayHideDelay,
      () {
        pendingOverlayTimers[key] = null;
        if (stopped) return;
        overlayState[key] = value;
        queueOverlayUpdate();
      },
    );
  }

  final overlayState =
  <String, dynamic>{'''
              if marker not in s:
                  raise SystemExit('overlay marker not found')
              s = s.replace(marker, helpers, 1)

          if "'userNotDetected': false," not in s:
              marker = "    'lowLight': false,\n    'wristTilt': 0.0,"
              if marker not in s:
                  raise SystemExit('overlay field marker not found')
              s = s.replace(marker, "    'lowLight': false,\n    'userNotDetected': false,\n    'wristTilt': 0.0,", 1)

          start = s.index('  void setOverlayFlag(')
          end = s.index('\n  // ==========================================================================\n  // SHUTDOWN', start)
          new_method = '''  void setOverlayFlag(
      String key,
      bool value, {
        double? wristTilt,
        double? hunchRatio,
        double? lightLux,
      }) {
    if (wristTilt != null) overlayState['wristTilt'] = wristTilt;
    if (hunchRatio != null) overlayState['hunchRatio'] = hunchRatio;
    if (lightLux != null) overlayState['lightLux'] = lightLux;

    if (key == 'userNotDetected') {
      _cancelPendingOverlayTimer(key);
      overlayState[key] = value;
      queueOverlayUpdate();
      return;
    }

    const warningKeys = <String>{
      'tooClose', 'neck', 'wrist', 'hunch', 'lowLight',
    };

    if (warningKeys.contains(key)) {
      _setOverlayWarningDebounced(key, value);
      return;
    }

    queueOverlayUpdate();
  }
'''
          s = s[:start] + new_method + s[end:]

          if 'postureDetectionWatchdog?.cancel();' not in s:
              marker = "    pushTimer?.cancel();\n    emailTimer?.cancel();"
              replacement = """    pushTimer?.cancel();
    emailTimer?.cancel();
    postureDetectionWatchdog?.cancel();
    for (final timer in pendingOverlayTimers.values) { timer?.cancel(); }
    pendingOverlayTimers.clear();"""
              if marker not in s:
                  raise SystemExit('shutdown marker not found')
              s = s.replace(marker, replacement, 1)

          if '_startPostureDetectionWatchdog();' not in s:
              marker = "  // NETWORK SYNC\n  // ============================================================================\n\n  syncService.start();"
              if marker not in s:
                  marker = "  syncService.start();"
              s = s.replace(marker, "  _startPostureDetectionWatchdog();\n\n" + marker, 1)

          neck_old = """          final data =
          Map<dynamic, dynamic>.from(
            raw,
          );

          final status =
              data['status']"""
          neck_new = """          final data =
          Map<dynamic, dynamic>.from(
            raw,
          );

          lastNeckSignalAt = DateTime.now();
          final detected = _readUserDetected(data);
          if (!detected) {
            _setUserNotDetected(true);
            return;
          }
          if (userNotDetected) _setUserNotDetected(false);

          final status =
              data['status']"""
          if 'lastNeckSignalAt = DateTime.now();' not in s:
              if neck_old not in s:
                  raise SystemExit('neck marker not found')
              s = s.replace(neck_old, neck_new, 1)

          hunch_old = """          final data =
          Map<dynamic, dynamic>.from(
            raw,
          );

          final isHunching ="""
          hunch_new = """          final data =
          Map<dynamic, dynamic>.from(
            raw,
          );

          lastHunchSignalAt = DateTime.now();
          final detected = _readUserDetected(data);
          if (!detected) {
            _setUserNotDetected(true);
            return;
          }
          if (userNotDetected) _setUserNotDetected(false);

          final isHunching ="""
          if 'lastHunchSignalAt = DateTime.now();' not in s:
              if hunch_old not in s:
                  raise SystemExit('hunch marker not found')
              s = s.replace(hunch_old, hunch_new, 1)

          p.write_text(s, encoding='utf-8')

          # Dashboard: auto-enable PDS for users with no explicit OFF choice.
          p = Path('lib/UI/dashboard.dart')
          s = p.read_text(encoding='utf-8')
          if "import 'package:flutter/services.dart';" not in s:
              s = s.replace("import 'package:flutter/material.dart';\n", "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n", 1)
          if "import '../services/app_permission_manager.dart';" not in s:
              s = s.replace("import '../services/background_service.dart';\n", "import '../services/app_permission_manager.dart';\nimport '../services/background_service.dart';\n", 1)
          if "static const _cameraChannel = 'com.s_health/camera_control';" not in s:
              marker = "  static const Color subtext = Color(0xFF7D8D89);\n"
              if marker not in s: raise SystemExit('dashboard color marker not found')
              s = s.replace(marker, marker + "  static const _cameraChannel = 'com.s_health/camera_control';\n", 1)
          if '_ensureDefaultMonitoring();' not in s:
              needle = "    _listenToService();\n    _refreshMonitoringState();"
              if needle not in s: raise SystemExit('dashboard init marker not found')
              s = s.replace(needle, needle + "\n    _ensureDefaultMonitoring();", 1)
          if 'Future<void> _ensureDefaultMonitoring() async' not in s:
              marker = "  void _goTo(int index) {"
              helper = r'''  Future<void> _ensureDefaultMonitoring() async {
    try {
      final prefs = await SharedPreferences.getInstance();
      await prefs.reload();
      final configured = prefs.getBool('monitoring_enabled');
      if (configured == false) return;
      final divisor = prefs.getDouble('hunch_divisor');
      if (divisor == null || !divisor.isFinite || divisor <= 0) return;
      if (await BackgroundMonitorService.isRunning) return;

      final granted =
          await AppPermissionManager.ensureMonitoringPermissions();
      if (!granted) return;

      const channel = MethodChannel(_cameraChannel);
      await channel.invokeMethod(
        'saveHunchDivisor',
        {'hunch_divisor': divisor},
      );
      await channel.invokeMethod(
        'startCamera',
        {'hunch_divisor': divisor},
      );

      await BackgroundMonitorService.initialize();
      BackgroundMonitorService.start();
      await prefs.setBool('monitoring_enabled', true);

      if (mounted) setState(() => serviceAlive = true);
    } catch (e, stackTrace) {
      debugPrint('[Dashboard] Default PDS startup failed: $e');
      debugPrintStack(stackTrace: stackTrace);
    }
  }

'''
              if marker not in s: raise SystemExit('dashboard insert marker not found')
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')

          # Settings default follows the new PDS default.
          p = Path('lib/UI/settings_page.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("prefs.getBool('monitoring_enabled') ?? false", "prefs.getBool('monitoring_enabled') ?? true", 1)
          p.write_text(s, encoding='utf-8')

          # Overlay HUD: person-not-detected icon.
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')
          if 'bool _showUserNotDetected = false;' not in s:
              s = s.replace("  bool _showLowLight = false;\n", "  bool _showLowLight = false;\n  bool _showUserNotDetected = false;\n", 1)
          if "_showUserNotDetected = readBool('userNotDetected');" not in s:
              s = s.replace("          _showLowLight = readBool('lowLight') || readBool('lowLightPoor');\n", "          _showLowLight = readBool('lowLight') || readBool('lowLightPoor');\n          _showUserNotDetected = readBool('userNotDetected');\n", 1)
          if 'Icons.person_off_outlined' not in s:
              marker = """                    if (_showWrist)
                      _indicatorCircle(Icons.pan_tool, Colors.purple),
"""
              replacement = """                    if (_showWrist)
                      _indicatorCircle(Icons.pan_tool, Colors.purple),
                    if (_showUserNotDetected)
                      _indicatorCircle(
                        Icons.person_off_outlined,
                        Colors.blueGrey,
                      ),
"""
              if marker not in s: raise SystemExit('main indicator marker not found')
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -e
          grep -q "_overlayShowDelay = Duration(milliseconds: 500)" lib/services/background_service.dart
          grep -q "bool userNotDetected = false" lib/services/background_service.dart
          grep -q "Future<void> _ensureDefaultMonitoring() async" lib/UI/dashboard.dart
          grep -q "Icons.person_off_outlined" lib/main.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/background_service.dart lib/UI/dashboard.dart lib/UI/settings_page.dart lib/main.dart
          git commit -m 'Apply PDS stability changes v4'
          git push origin ui-overhaul-2026-08
          git rm .github/workflows/apply-pds-stability-v4.yml
          git commit -m 'Remove PDS stability v4 workflow'
          git push origin ui-overhaul-2026-08
