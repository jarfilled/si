name: Final profile dispose repair
on:
  push:
    branches: [ui-overhaul-2026-08]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'Repair profile dispose placement')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
          fetch-depth: 1
      - name: Repair source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/UI/profile_page.dart')
          t = p.read_text(encoding='utf-8')

          # Remove every misplaced disposal first.
          t = t.replace('    _tourScrollController.dispose();\n', '')

          class_marker = 'class ProfilePageState extends State<ProfilePage> {'
          class_pos = t.find(class_marker)
          if class_pos < 0:
              raise SystemExit('ProfilePageState not found')

          data_marker = '  // ---------------------------------------------------------------------------\n  // DATA\n'
          data_pos = t.find(data_marker, class_pos)
          if data_pos < 0:
              raise SystemExit('Profile DATA marker not found')

          dispose_block = '  @override\n  void dispose() {\n    _tourScrollController.dispose();\n    super.dispose();\n  }\n\n'
          t = t[:data_pos] + dispose_block + t[data_pos:]
          p.write_text(t, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/UI/profile_page.dart
          git commit -m "Repair profile dispose placement"
          git push origin ui-overhaul-2026-08
      - name: Remove workflow
        run: |
          git rm .github/workflows/final-fix-profile-dispose.yml
          git commit -m "Remove final profile dispose workflow"
          git push origin ui-overhaul-2026-08
