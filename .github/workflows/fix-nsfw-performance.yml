name: Optimize NSFW detection
on:
  push:
    branches: [ui-overhaul-2026-08]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Optimize NSFW detection') && !contains(github.event.head_commit.message, 'Remove temporary NSFW optimization workflow')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-overhaul-2026-08
          fetch-depth: 1

      - name: Patch NSFW detector and overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # pubspec: use the release that provides detectBytesInBackground().
          replace(
              'pubspec.yaml',
              '  nsfw_detector_flutter: ^1.0.5',
              '  nsfw_detector_flutter: ^2.0.2',
              'NSFW package version',
          )

          # Detector: remove UI-isolate model loading and synchronous image decode.
          p = Path('lib/backend/nsfw_detection.dart')
          text = p.read_text(encoding='utf-8')
          text = text.replace("import 'package:image/image.dart' as img;\n", '', 1)
          text = text.replace('  NsfwDetector? _detector;\n\n', '', 1)
          text = text.replace(
              """  Future<void> init() async {
    _detector ??= await NsfwDetector.load();

    _hasOverlayPermission =
    await FlutterOverlayWindow.isPermissionGranted();
""",
              """  Future<void> init() async {
    _hasOverlayPermission =
    await FlutterOverlayWindow.isPermissionGranted();
""",
              'remove UI-isolate detector load',
          )
          text = text.replace(
              """  Future<void> _captureAndDetect() async {
    if (!_isActive ||
        _isProcessing ||
        _detector == null ||
        !_hasOverlayPermission) {
      return;
    }
""",
              """  Future<void> _captureAndDetect() async {
    if (!_isActive ||
        _isProcessing ||
        !_hasOverlayPermission) {
      return;
    }
""",
              'detector guard',
          )
          old_decode = """      final image =
      img.decodeImage(base64Decode(b64));

      if (image == null || !_isActive) {
        return;
      }

      final result =
      await _detector!.detectNSFWFromImage(image);
"""
          new_decode = """      final imageBytes =
          Uint8List.fromList(base64Decode(b64));

      if (imageBytes.isEmpty || !_isActive) {
        return;
      }

      // The detector performs model load + inference in a background isolate,
      // keeping TensorFlow/image work off Flutter's UI isolate.
      final result =
      await NsfwDetector.detectBytesInBackground(imageBytes);
"""
          if old_decode not in text:
              raise SystemExit('NSFW decode/inference block missing')
          text = text.replace(old_decode, new_decode, 1)
          p.write_text(text, encoding='utf-8')

          # Overlay: make dismissal an explicit X and avoid duplicate shareData.
          p = Path('lib/main.dart')
          text = p.read_text(encoding='utf-8')
          old_warning = """  Widget _buildNsfwWarning() {
    debugPrint(
      '[OverlayHud] BUILDING NSFW WARNING',
    );

    return Center(
      child: Container(
        width: 300,

        margin: const EdgeInsets.symmetric(
          horizontal: 12,
          vertical: 8,
        ),

        padding: const EdgeInsets.symmetric(
          horizontal: 18,
          vertical: 12,
        ),

        decoration: BoxDecoration(
          color: Colors.black.withValues(alpha: 0.94),

          borderRadius: BorderRadius.circular(
            18,
          ),

          border: Border.all(
            color: Colors.redAccent.withValues(alpha: 0.85),
            width: 2,
          ),

          boxShadow: [
            BoxShadow(
              color: Colors.black.withValues(alpha: 0.45),
              blurRadius: 16,
              spreadRadius: 2,
            ),
          ],
        ),

        child: Column(
          mainAxisSize: MainAxisSize.min,

          children: [
            Row(
              mainAxisSize: MainAxisSize.min,
              children: [
                const Icon(
                  Icons.visibility_off_rounded,
                  color: Colors.redAccent,
                  size: 25,
                ),

                const SizedBox(
                  width: 10,
                ),

                Flexible(
                  child: Text(
                    'محتوای نامناسب شناسایی شد',
                    textAlign: TextAlign.center,
                    maxLines: 2,
                    overflow: TextOverflow.ellipsis,
                    style: const TextStyle(
                      color: Colors.white,
                      fontSize: 16,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
              ],
            ),

            const SizedBox(
              height: 7,
            ),

            const Text(
              'برای ادامه استفاده ایمن، به برنامه بازگردید.',
              textAlign: TextAlign.center,
              maxLines: 2,
              overflow: TextOverflow.ellipsis,
              style: TextStyle(
                color: Colors.white70,
                fontSize: 12,
                height: 1.25,
              ),
            ),

            const SizedBox(
              height: 9,
            ),

            SizedBox(
              height: 34,
              width: 150,

              child: ElevatedButton(
                onPressed: _dismissNsfw,

                style: ElevatedButton.styleFrom(
                  padding: EdgeInsets.zero,

                  minimumSize: Size.zero,

                  tapTargetSize:
                  MaterialTapTargetSize.shrinkWrap,

                  shape: RoundedRectangleBorder(
                    borderRadius:
                    BorderRadius.circular(10),
                  ),
                ),

                child: const Text(
                  'بازگشت به برنامه',
                  style: TextStyle(
                    fontSize: 12,
                    fontWeight: FontWeight.bold,
                  ),
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }
"""
          new_warning = """  Widget _buildNsfwWarning() {
    return Center(
      child: Container(
        width: 320,
        margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
        padding: const EdgeInsets.fromLTRB(16, 10, 16, 14),
        decoration: BoxDecoration(
          color: Colors.black.withValues(alpha: 0.94),
          borderRadius: BorderRadius.circular(20),
          border: Border.all(
            color: Colors.redAccent.withValues(alpha: 0.85),
            width: 2,
          ),
          boxShadow: [
            BoxShadow(
              color: Colors.black.withValues(alpha: 0.45),
              blurRadius: 16,
              spreadRadius: 2,
            ),
          ],
        ),
        child: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            Row(
              crossAxisAlignment: CrossAxisAlignment.center,
              children: [
                const Icon(
                  Icons.visibility_off_rounded,
                  color: Colors.redAccent,
                  size: 25,
                ),
                const SizedBox(width: 10),
                const Expanded(
                  child: Text(
                    'محتوای نامناسب شناسایی شد',
                    textAlign: TextAlign.center,
                    maxLines: 2,
                    overflow: TextOverflow.ellipsis,
                    style: TextStyle(
                      color: Colors.white,
                      fontSize: 16,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
                const SizedBox(width: 4),
                SizedBox(
                  width: 44,
                  height: 44,
                  child: IconButton(
                    onPressed: _dismissNsfw,
                    tooltip: 'بستن',
                    padding: EdgeInsets.zero,
                    constraints: const BoxConstraints.tightFor(
                      width: 44,
                      height: 44,
                    ),
                    icon: const Icon(
                      Icons.close_rounded,
                      color: Colors.white70,
                      size: 24,
                    ),
                  ),
                ),
              ],
            ),
            const SizedBox(height: 5),
            const Text(
              'برای ادامه استفاده ایمن، به برنامه بازگردید.',
              textAlign: TextAlign.center,
              maxLines: 2,
              overflow: TextOverflow.ellipsis,
              style: TextStyle(
                color: Colors.white70,
                fontSize: 12,
                height: 1.25,
              ),
            ),
            const SizedBox(height: 10),
            SizedBox(
              height: 36,
              width: 170,
              child: ElevatedButton(
                onPressed: _dismissNsfw,
                style: ElevatedButton.styleFrom(
                  padding: EdgeInsets.zero,
                  minimumSize: Size.zero,
                  tapTargetSize: MaterialTapTargetSize.shrinkWrap,
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.circular(10),
                  ),
                ),
                child: const Text(
                  'ادامه در برنامه',
                  style: TextStyle(
                    fontSize: 12,
                    fontWeight: FontWeight.bold,
                  ),
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }
"""
          if old_warning not in text:
              raise SystemExit('NSFW warning widget block missing')
          text = text.replace(old_warning, new_warning, 1)

          old_dismiss = """      if (await FlutterOverlayWindow.isActive()) {
        await FlutterOverlayWindow.shareData({
          'type': 'none',
        });
      }

      // ----------------------------------------------------------------------
      // Tell the native detector to resume.
      // ----------------------------------------------------------------------
"""
          new_dismiss = """      // The detector owns overlay shutdown. Do not send a second overlay
      // message here; doing both races the detector's close lifecycle.
      // ----------------------------------------------------------------------
      // Tell the native detector to resume.
      // ----------------------------------------------------------------------
"""
          if old_dismiss not in text:
              raise SystemExit('NSFW dismiss block missing')
          text = text.replace(old_dismiss, new_dismiss, 1)
          p.write_text(text, encoding='utf-8')

          print('NSFW optimization patch applied.')
          PY

      - name: Verify source
        run: |
          grep -q "nsfw_detector_flutter: ^2.0.2" pubspec.yaml
          grep -q "detectBytesInBackground" lib/backend/nsfw_detection.dart
          ! grep -q "NsfwDetector? _detector" lib/backend/nsfw_detection.dart
          grep -q "Icons.close_rounded" lib/main.dart
          grep -q "tooltip: 'بستن'" lib/main.dart
          echo "NSFW source verification passed."

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml lib/backend/nsfw_detection.dart lib/main.dart
          git commit -m 'Optimize NSFW detection and overlay dismissal'
          git push origin ui-overhaul-2026-08
          git rm .github/workflows/fix-nsfw-performance.yml
          git commit -m 'Remove temporary NSFW optimization workflow'
          git push origin ui-overhaul-2026-08
